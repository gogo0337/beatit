<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Hit ME!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0f0f1a;font-family:'Nunito',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow-x:hidden}
#wrap{width:100%;max-width:420px;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:56px 18px 60px;position:relative}
.app-title{font-family:'Fredoka One',cursive;font-size:32px;background:linear-gradient(135deg,#e94560,#f5a623);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:.02em}
.top-row{position:absolute;top:16px;right:16px;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:99px;padding:6px 12px 6px 9px;cursor:pointer;user-select:none;font-size:12px;font-weight:700;color:#666;transition:all .2s}
.top-row.on{background:#fee500;border-color:#fee500;color:#3c1e1e}
.top-row:active{transform:scale(.95)}
.sw{width:26px;height:15px;background:rgba(255,255,255,.15);border-radius:99px;position:relative;transition:background .2s;flex-shrink:0}
.sw::after{content:'';position:absolute;width:11px;height:11px;background:#fff;border-radius:50%;top:2px;left:2px;transition:transform .2s}
.top-row.on .sw{background:rgba(0,0,0,.2)}
.top-row.on .sw::after{transform:translateX(11px)}
.cat-wrap{width:100%;display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.cat-btn{padding:5px 13px;border-radius:99px;border:1.5px solid rgba(255,255,255,.1);background:transparent;color:#555;font-family:'Nunito',sans-serif;font-weight:700;font-size:11px;cursor:pointer;transition:all .15s;white-space:nowrap}
.cat-btn.active{background:#e94560;border-color:#e94560;color:#fff}
.cat-btn:active{transform:scale(.93)}
.info{text-align:center;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.info-cat{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#e94560}
.info-name{font-family:'Fredoka One',cursive;font-size:24px;color:#eaeaea;line-height:1}
.btn-wrap{position:relative;display:flex;align-items:center;justify-content:center}
.ripple-ring{position:absolute;width:176px;height:176px;border-radius:50%;border:2.5px solid #e94560;opacity:0;pointer-events:none}
@keyframes rpl{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.8);opacity:0}}
.ripple-ring.go{animation:rpl .55s ease-out forwards}
.btn-outer{width:176px;height:176px;border-radius:50%;border:none;outline:none;background:#1e1e30;box-shadow:0 10px 0 #0a0a14,0 12px 20px rgba(0,0,0,.65);cursor:pointer;transition:transform .08s,box-shadow .08s;display:flex;align-items:center;justify-content:center}
.btn-outer:active,.btn-outer.pressed{transform:translateY(9px);box-shadow:0 1px 0 #0a0a14,0 3px 8px rgba(0,0,0,.5)}
.btn-face{width:156px;height:156px;border-radius:50%;background:radial-gradient(circle at 36% 30%,#2a2a45,#16162a);border:2px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:74px;line-height:1;pointer-events:none;transition:transform .08s}
.btn-outer:active .btn-face,.btn-outer.pressed .btn-face{transform:scale(.94)}
.next-btn{background:transparent;border:1.5px solid rgba(255,255,255,.12);border-radius:99px;padding:9px 28px;color:#555;font-family:'Nunito',sans-serif;font-weight:700;font-size:13px;cursor:pointer;transition:all .15s}
.next-btn:hover{border-color:rgba(255,255,255,.25);color:#aaa}
.next-btn:active{transform:scale(.95)}
.donate-status{display:none;align-items:center;justify-content:space-between;width:100%;background:#1a1a2e;border:1px solid rgba(254,229,0,.2);border-radius:14px;padding:10px 16px}
.donate-status.visible{display:flex}
.ds-left{display:flex;flex-direction:column;gap:2px}
.ds-clicks{font-family:'Fredoka One',cursive;font-size:22px;color:#fee500;line-height:1}
.ds-label{font-size:11px;font-weight:700;color:#666}
.ds-amount{font-family:'Fredoka One',cursive;font-size:16px;color:#fee500}
.send-btn{background:#fee500;color:#3c1e1e;border:none;border-radius:10px;padding:9px 16px;font-family:'Fredoka One',cursive;font-size:14px;cursor:pointer;white-space:nowrap;transition:transform .1s,opacity .1s;flex-shrink:0}
.send-btn:active{transform:scale(.93);opacity:.85}
/* 동의 모달 */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;align-items:center;justify-content:center;padding:24px}
.modal-bg.open{display:flex}
.modal{background:#1a1a2e;border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:28px 24px;width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.modal-icon{font-size:44px;line-height:1}
.modal-title{font-family:'Fredoka One',cursive;font-size:22px;color:#eaeaea}
.modal-desc{font-size:14px;font-weight:700;color:#888;line-height:1.6}
.modal-account{background:#0f0f1a;border:1px solid rgba(254,229,0,.3);border-radius:12px;padding:14px 20px;width:100%}
.modal-account-name{font-family:'Fredoka One',cursive;font-size:18px;color:#fee500;margin-bottom:4px}
.modal-account-num{font-size:13px;font-weight:700;color:#aaa;letter-spacing:.05em}
.modal-agree{font-size:12px;color:#555;line-height:1.6}
.modal-confirm{width:100%;background:#e94560;color:#fff;border:none;border-radius:12px;padding:14px;font-family:'Fredoka One',cursive;font-size:18px;cursor:pointer;transition:transform .1s}
.modal-confirm:active{transform:scale(.97)}
.modal-cancel{background:transparent;border:none;color:#555;font-family:'Nunito',sans-serif;font-weight:700;font-size:13px;cursor:pointer;padding:4px}
/* QR 모달 */
.qr-modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;align-items:center;justify-content:center;padding:24px}
.qr-modal-bg.open{display:flex}
.qr-modal{background:#1a1a2e;border:1px solid rgba(254,229,0,.25);border-radius:20px;padding:28px 24px;width:100%;max-width:320px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.qr-title{font-family:'Fredoka One',cursive;font-size:20px;color:#eaeaea}
.qr-amount-badge{background:#fee500;color:#3c1e1e;font-family:'Fredoka One',cursive;font-size:22px;border-radius:12px;padding:10px 24px}
.qr-desc{font-size:12px;color:#666;line-height:1.7}
.qr-box{background:#fff;border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:center}
.qr-hint{font-size:11px;color:#555;line-height:1.6}
.qr-close{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 28px;color:#aaa;font-family:'Nunito',sans-serif;font-weight:700;font-size:13px;cursor:pointer;transition:all .15s;margin-top:4px}
.qr-close:active{transform:scale(.96)}
</style>
</head>
<body>
<div id="wrap">
  <div class="top-row" id="tog" onclick="handleDonateToggle()">
    <span style="font-size:15px">☕</span>
    <span id="togLabel">후원하기</span>
    <div class="sw"></div>
  </div>
  <div class="app-title">Hit ME!</div>
  <div class="cat-wrap" id="catWrap"></div>
  <div class="info">
    <div class="info-cat" id="infoCat"></div>
    <div class="info-name" id="infoName"></div>
  </div>
  <div class="btn-wrap">
    <div class="ripple-ring" id="rippleRing"></div>
    <button class="btn-outer" id="mainBtn">
      <div class="btn-face" id="btnFace">🎵</div>
    </button>
  </div>
  <button class="next-btn" onclick="nextSound()">▶&nbsp; 다음</button>
  <div class="donate-status" id="donateStatus">
    <div class="ds-left">
      <div class="ds-clicks"><span id="clickCount">0</span>번 클릭</div>
      <div class="ds-label">누적 후원금액</div>
      <div class="ds-amount">₩<span id="totalAmount">0</span></div>
    </div>
    <button class="send-btn" onclick="sendDonation()">카카오페이<br>송금하기</button>
  </div>
</div>

<!-- QR 모달 -->
<div class="qr-modal-bg" id="qrModalBg" onclick="closeQR(event)">
  <div class="qr-modal">
    <div class="qr-title">카카오페이 송금</div>
    <div class="qr-amount-badge" id="qrAmount">₩0</div>
    <div class="qr-desc">아래 QR을 카카오페이 앱으로 스캔하거나<br>모바일에서 접속해 바로 송금하세요</div>
    <div class="qr-box"><canvas id="qrCanvas" width="180" height="180"></canvas></div>
    <div class="qr-hint">📱 카카오페이 앱 → 우측 상단 QR 스캔<br>금액란에 <strong id="qrHintAmount" style="color:#fee500">₩0</strong> 을 입력해 주세요</div>
    <button class="qr-close" onclick="closeQRBtn()">닫기</button>
  </div>
</div>

<!-- 동의 모달 -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-icon">💛</div>
    <div class="modal-title">후원하기</div>
    <div class="modal-desc">버튼을 클릭할 때마다<br><strong style="color:#fee500">10원씩</strong> 후원됩니다</div>
    <div class="modal-account">
      <div class="modal-account-name">Martin Kim</div>
      <div class="modal-account-num">카카오뱅크 · 후원 계좌</div>
    </div>
    <div class="modal-agree">아래 동의 버튼을 누르면<br>버튼 클릭 횟수 × 10원을<br>카카오페이로 직접 송금하는 데 동의합니다.</div>
    <button class="modal-confirm" onclick="agreeAndEnable()">동의하고 후원 시작 ✓</button>
    <button class="modal-cancel" onclick="cancelDonate()">취소</button>
  </div>
</div>

<!-- sounds.js 를 먼저 로드 (여기서 SOUNDS 배열 정의) -->
<script src="sounds.js"></script>

<script>
// ── 오디오 헬퍼 ──────────────────────────────────────
const $=id=>document.getElementById(id);
function noise(c,dur,lp,vol=1){let g=c.createGain();g.gain.setValueAtTime(vol,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);g.connect(c.destination);let b=c.createBuffer(1,c.sampleRate*dur,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;let s=c.createBufferSource();s.buffer=b;let f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;s.connect(f);f.connect(g);s.start()}
function noiseEnv(c,dur,lp,atkT,susT,vol=1){let g=c.createGain();g.gain.setValueAtTime(0,c.currentTime);g.gain.linearRampToValueAtTime(vol,c.currentTime+atkT);g.gain.setValueAtTime(vol,c.currentTime+susT);g.gain.linearRampToValueAtTime(0,c.currentTime+dur);g.connect(c.destination);let b=c.createBuffer(1,c.sampleRate*dur,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;let s=c.createBufferSource();s.buffer=b;let f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=lp;f.Q.value=.5;s.connect(f);f.connect(g);s.start()}
function osc(c,type,freqs,dur,vol=.3){freqs.forEach((f,i)=>{let g=c.createGain();g.gain.setValueAtTime(vol,c.currentTime+i*dur);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+i*dur+dur+.05);g.connect(c.destination);let o=c.createOscillator();o.type=type;o.frequency.value=f;o.connect(g);o.start(c.currentTime+i*dur);o.stop(c.currentTime+i*dur+dur+.05)})}
function sweep(c,type,f0,f1,dur,vol=.35){let g=c.createGain();g.gain.setValueAtTime(vol,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);g.connect(c.destination);let o=c.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,c.currentTime);o.frequency.exponentialRampToValueAtTime(f1,c.currentTime+dur);o.connect(g);o.start();o.stop(c.currentTime+dur)}
function chord(c,type,freqs,dur,vol=.25){freqs.forEach(f=>{let g=c.createGain();g.gain.setValueAtTime(vol/freqs.length*2,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);g.connect(c.destination);let o=c.createOscillator();o.type=type;o.frequency.value=f;o.connect(g);o.start();o.stop(c.currentTime+dur)})}
function melody(c,type,notes,vol=.3){notes.forEach(([f,d,t])=>{let g=c.createGain();g.gain.setValueAtTime(vol,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+d);g.connect(c.destination);let o=c.createOscillator();o.type=type;o.frequency.value=f;o.connect(g);o.start(c.currentTime+t);o.stop(c.currentTime+t+d+.02)})}

// ── TTS (Web Speech API) ─────────────────────────────
function speak(text){
  if(!window.speechSynthesis)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ko-KR';u.rate=1.1;u.pitch=1.1;u.volume=1;
  // 한국어 목소리 우선 선택
  const voices=speechSynthesis.getVoices();
  const koVoice=voices.find(v=>v.lang.startsWith('ko'));
  if(koVoice)u.voice=koVoice;
  speechSynthesis.speak(u);
}

// ── 앱 상태 ──────────────────────────────────────────
let ctx=null,filtered=[...SOUNDS],filterCat=null,idx=0;
let donateOn=false,donateAgreed=false,clickCount=0;
const KAKAO_LINK='https://qr.kakaopay.com/Fa8v84E3c';

function getCtx(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}
function pickRandom(ex){if(filtered.length===1)return 0;let n;do{n=Math.floor(Math.random()*filtered.length)}while(n===ex);return n}

function render(){
  const s=filtered[idx];
  $('btnFace').textContent=s.e;
  $('infoCat').textContent=s.cat;
  $('infoName').textContent=s.name;
}

function play(){
  const s=filtered[idx];if(!s)return;
  // speech: 접두어 처리
  if(typeof s.fn==='string'&&s.fn.startsWith('speech:')){
    speak(s.fn.slice(7));
  } else {
    try{s.fn(getCtx())}catch(e){}
  }
  if(navigator.vibrate)navigator.vibrate(25);
  const ring=$('rippleRing');ring.classList.remove('go');void ring.offsetWidth;ring.classList.add('go');
  const btn=$('mainBtn');btn.classList.add('pressed');setTimeout(()=>btn.classList.remove('pressed'),120);
  if(donateOn&&donateAgreed){clickCount++;$('clickCount').textContent=clickCount;$('totalAmount').textContent=(clickCount*10).toLocaleString()}
}

function nextSound(){idx=pickRandom(idx);render()}

function buildCats(){
  const cats=['전체',...new Set(SOUNDS.map(s=>s.cat))];
  const wrap=$('catWrap');wrap.innerHTML='';
  cats.forEach(cat=>{
    const b=document.createElement('button');
    b.className='cat-btn'+(cat===(filterCat||'전체')?' active':'');
    b.textContent=cat;
    b.onclick=()=>{filterCat=cat==='전체'?null:cat;filtered=filterCat?SOUNDS.filter(s=>s.cat===filterCat):[...SOUNDS];idx=Math.floor(Math.random()*filtered.length);buildCats();render()};
    wrap.appendChild(b);
  });
}

// ── 후원 ─────────────────────────────────────────────
function handleDonateToggle(){
  if(donateOn){donateOn=false;$('tog').classList.remove('on');$('togLabel').textContent='후원하기';$('donateStatus').classList.remove('visible')}
  else{if(!donateAgreed)$('modalBg').classList.add('open');else enableDonate()}
}
function agreeAndEnable(){donateAgreed=true;$('modalBg').classList.remove('open');enableDonate()}
function enableDonate(){donateOn=true;$('tog').classList.add('on');$('togLabel').textContent='ON';$('donateStatus').classList.add('visible')}
function cancelDonate(){$('modalBg').classList.remove('open')}
function resetCount(){clickCount=0;$('clickCount').textContent=0;$('totalAmount').textContent=0}

function sendDonation(){
  if(clickCount===0){alert('아직 클릭한 횟수가 없어요!\n버튼을 눌러보세요 😊');return}
  const amount=clickCount*10;
  const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if(isMobile){
    window.open(KAKAO_LINK,'_blank');
    setTimeout(()=>{alert(`✅ 카카오페이에서\n₩${amount.toLocaleString()} 을 입력해 송금해 주세요!\n(${clickCount}번 클릭 × 10원)`);resetCount();},800);
  } else {
    $('qrAmount').textContent='₩'+amount.toLocaleString();
    $('qrHintAmount').textContent='₩'+amount.toLocaleString();
    drawQR(KAKAO_LINK);
    $('qrModalBg').classList.add('open');
  }
}
function closeQRBtn(){$('qrModalBg').classList.remove('open');resetCount()}
function closeQR(e){if(e.target===$('qrModalBg'))closeQRBtn()}

function drawQR(url){
  const canvas=$('qrCanvas'),ctx2=canvas.getContext('2d');
  const size=180;canvas.width=size;canvas.height=size;
  ctx2.fillStyle='#fff';ctx2.fillRect(0,0,size,size);
  const doRender=()=>{
    const tmp=document.createElement('div');tmp.style.display='none';document.body.appendChild(tmp);
    new QRCode(tmp,{text:url,width:size,height:size,colorDark:'#0f0f1a',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
    setTimeout(()=>{
      const el=tmp.querySelector('canvas')||tmp.querySelector('img');
      if(el){const i=new Image();i.onload=()=>{ctx2.drawImage(i,0,0,size,size);};i.src=el.tagName==='CANVAS'?el.toDataURL():el.src;}
      document.body.removeChild(tmp);
    },300);
  };
  if(window.QRCode){doRender();}
  else{
    const sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
    sc.onload=doRender;document.head.appendChild(sc);
  }
}

// ── 초기화 ────────────────────────────────────────────
// TTS 목소리 미리 로드
if(window.speechSynthesis){
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();
}
$('mainBtn').addEventListener('click',play);
idx=Math.floor(Math.random()*SOUNDS.length);
buildCats();render();
</script>
</body>
</html>
